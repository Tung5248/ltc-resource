:root{--green:#5f9586;--green2:#e8f0ed;--ink:#233532;--muted:#70807b;--line:#dfe8e4;--bg:#f5f8f7;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
main{max-width:760px;margin:auto;padding:28px 18px 60px}
.hero{padding:10px 2px 20px}

.panel{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 8px 28px rgba(36,65,58,.06)}
label{display:block;font-size:14px;font-weight:800;margin:0 0 8px;color:#49605a}
.search{width:100%;padding:16px 17px;border:2px solid #d9e4e0;border-radius:16px;font-size:17px;outline:none;background:#fff}
.search:focus{border-color:var(--green)}
.service-buttons{display:flex;flex-wrap:wrap;gap:8px;width:100%;padding:2px 0 5px}
.service-btn{flex:0 1 auto;max-width:100%;border:1px solid #d9dee5;background:#fff;color:#4b5563;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.2;font-family:inherit;cursor:pointer;white-space:nowrap;width:100%;box-sizing:border-box;text-align:center;display:flex;align-items:center;justify-content:center}

.town-filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.town-row{margin-top:0}.town-row label{display:block;margin-bottom:6px}.town-row .select:disabled{background:#f4f7f6;color:#9aa7a3}
.select{width:100%;padding:14px;border:1px solid #d7e2de;border-radius:15px;background:#fff;font-size:16px;color:var(--ink)}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 2px 12px;color:var(--muted);font-size:16px}
.sync{font-size:12px;background:#edf4f1;padding:7px 10px;border-radius:999px;color:#55746b;white-space:nowrap}

/* v55：快速回到頁首 */

<body>
<main>
<section class="hero">
<div class="eyebrow">LONG-TERM CARE · RESOURCE</div>
<h1>特約單位電話查詢</h1>
<p id="subtitle" style="display:none"></p>
</section>

<section class="panel">
<label for="q">搜尋</label>
<input id="q" class="search" placeholder="輸入單位名稱、服務類型、碼別等…" autocomplete="off">

<div style="margin-top:15px">
<label>服務類型</label>
<div id="serviceButtons" class="service-buttons" role="group" aria-label="服務類型"></div>
</div>

<div class="town-filters">
  <div class="town-row"><label for="town">單位所在地</label><select id="town" class="select"><option value="">全部鄉鎮</option></select></div>
  <div class="town-row" id="serviceTownRow"><label for="serviceTown">服務區域</label><select id="serviceTown" class="select"><option value="">全部服務區域</option></select></div>
</div>

<div class="other-resources" id="otherResources">
  <button type="button" class="other-toggle" id="otherToggle" aria-expanded="false">
    <span>其他長照資源</span><span class="arrow">⌄</span>
  </button>
  <div class="other-resource-buttons" id="otherResourceButtons">
    <button type="button" class="other-resource-btn" data-resource="dementia_points">失智據點</button>
    <button type="button" class="other-resource-btn" data-resource="dementia_cocare">失智共照</button>
    <button type="button" class="other-resource-btn" data-resource="institution">機構安置</button>
    <button type="button" class="other-resource-btn" data-resource="alley">巷弄長照站</button>
    <button type="button" class="other-resource-btn" data-resource="family_care">家照服務</button>
  </div>
  <div class="other-resource-note" id="otherResourceNote">點選資源後，可直接用上方搜尋與鄉鎮篩選。</div>
  <div class="alley-nearby-tools" id="alleyNearbyTools" hidden>
    <div class="alley-distance-panel">
      <div class="alley-distance-row">
        <input id="alleyAddressInput" class="alley-address-input" type="text" inputmode="text" placeholder="輸入案家地址，例如：彰化市○○路100號">
        <button type="button" class="alley-distance-btn primary" id="alleyAddressBtn">🔎 以地址找附近</button>
        <button type="button" class="alley-distance-btn" id="alleyLocationBtn">📍 目前位置</button>
        <button type="button" class="alley-distance-btn" id="alleyClearDistanceBtn" hidden>清除距離</button>
      </div>
      <div class="alley-distance-status" id="alleyNearbyHint">可輸入案家地址，或使用目前位置；會依目前篩選出的巷弄長照站距離由近到遠排序。</div>
    </div>
  </div>
</div>
</section>

<div class="status">
  <span id="count">載入中…</span>
  <div class="status-actions">
    <button id="copyAllBtn" class="copy-all-btn" type="button" onclick="copyAllResults()" disabled>複製全部</button>
    
  </div>
</div>

<section id="list"></section>
<div class="source" id="source"></div>
<button type="button" class="back-to-top" id="backToTop" aria-label="回到頁首" title="回到頁首">↑</button>
</main>

<script>

function formatPhoneDisplay(v){
  if(v===null || v===undefined) return '';
  let s=String(v).trim();
  if(!s) return '';

  // 已經有換行／HTML break 的資料逐段處理
  const parts=s.replace(/<br\s*\/?>/gi,'\n').split(/\n+/).map(x=>x.trim()).filter(Boolean);
  if(parts.length>1) return parts.map(formatPhoneDisplay).join('\n');

  // 只有明確的常見單支電話格式才格式化，避免把黏在一起的兩支電話猜錯。
  // 手機：09xxxxxxxx -> 09xx-xxx-xxx
  let m=s.match(/^09\d{8}$/);
  if(m) return s.slice(0,4)+'-'+s.slice(4,7)+'-'+s.slice(7);

  // 04 市話：04 + 7碼；保留分機
  m=s.match(/^04[- ]?(\d{7})(#\d+)?$/);
  if(m) return '04-'+m[1]+(m[2]||'');

  return s;
}

function normalizePhoneListForDisplay(v){
  if(Array.isArray(v)){
    return v.flatMap(x=>String(x).replace(/<br\s*\/?>/gi,'\n').split(/\n+/))
      .map(x=>formatPhoneDisplay(x)).filter(Boolean);
  }
  return String(v||'').replace(/<br\s*\/?>/gi,'\n').split(/\n+/)
    .map(x=>formatPhoneDisplay(x)).filter(Boolean);
}

let CURRENT=null;
let CURRENT_ROWS=[];
let CURRENT_RESOURCE='';

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clean=s=>String(s??'').replace(/\s+/g,' ').trim();
const normTown=s=>String(s??'').replace(/[、，,；;]/g,' ').split(/\s+/).map(x=>x.trim()).filter(Boolean);
const townKey=s=>String(s??'').trim().replace(/(市|鎮|鄉)$/,'');
const cleanPhone=s=>esc(s).replace(/[；;\/]/g,'<br>');

function allTowns(records){
  const map=new Map();
  records.forEach(x=>{
    const vals=[x.town];
    const d=x.details||{};
    for(const v of Object.values(d)){
      if(Array.isArray(v)) vals.push(...v);
      else if(typeof v==='string' && (v.includes('鄉')||v.includes('鎮')||v.includes('市'))) vals.push(...normTown(v));
    }
    vals.flatMap(v=>normTown(v)).forEach(t=>{
      const k=townKey(t); if(!k)return;
      const old=map.get(k);
      if(!old || (/[市鎮鄉]$/.test(t)&&!/[市鎮鄉]$/.test(old))) map.set(k,t);
    });
  });
  return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant'));
}

const COUNTY_TOWNS=['彰化市','員林市','和美鎮','鹿港鎮','溪湖鎮','二林鎮','北斗鎮','田中鎮','線西鄉','伸港鄉','秀水鄉','福興鄉','埔鹽鄉','花壇鄉','大村鄉','埔心鄉','永靖鄉','田尾鄉','社頭鄉','溪州鄉','二水鄉','埤頭鄉','芳苑鄉','大城鄉','竹塘鄉','芬園鄉'];

function addressTown(x){
  if(x.town) return String(x.town).trim();
  const addr=String(x.address||'');
  return COUNTY_TOWNS.find(t=>addr.includes(t))||'';
}

function serviceAreaRaw(x, serviceName){
  const d=(x.details||{})[serviceName]||{};
  return d["服務鄉鎮"]??d["服務區域"]??'';
}

function isCountyWide(x, serviceName){
  const raw=serviceAreaRaw(x,serviceName);
  if(Array.isArray(raw)) return raw.some(v=>/全縣|全區|全彰化/.test(String(v)));
  return /全縣|全區|全彰化/.test(String(raw));
}

function serviceTowns(x, serviceName){
  const raw=serviceAreaRaw(x,serviceName);
  if(Array.isArray(raw)) return raw.flatMap(v=>normTown(v)).filter(t=>!/^全縣|^全區|^全彰化/.test(t));
  return normTown(raw).filter(t=>!/^全縣|^全區|^全彰化/.test(t));
}

function populateTowns(){
  // 第一個清單永遠代表「單位所在地」，不再混入服務範圍。
  const addressTowns=COUNTY_TOWNS.map(t=>[townKey(t),t]);
  $('town').innerHTML='<option value="">全部鄉鎮</option>'+
    addressTowns.map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join('');
  populateServiceTowns();
}

function populateServiceTowns(){
  // 第二個清單代表「服務區域」，與第一個「單位所在地」完全分開。
  const map=new Map();
  let countyWide=false;
  const addRecord=(x,serviceName)=>{
    if(isCountyWide(x,serviceName)) countyWide=true;
    serviceTowns(x,serviceName).forEach(t=>{
      const k=townKey(t); if(!k)return;
      const old=map.get(k);
      if(!old || (/[市鎮鄉]$/.test(t)&&!/[市鎮鄉]$/.test(old))) map.set(k,t);
    });
  };
  if(CURRENT?.id==='all') {
    for(const svc of DB.services){
      if(svc.id==='all') continue;
      for(const x of (svc.records||[])) addRecord(x,svc.name);
    }
  } else {
    for(const x of (CURRENT?.records||[])) addRecord(x,CURRENT.name);
  }
  const towns=countyWide
    ? COUNTY_TOWNS.map(t=>[townKey(t),t])
    : [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant'));
  const el=$('serviceTown');
  el.innerHTML='<option value="">全部服務區域</option>'+towns.map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join('');
  el.disabled=towns.length===0;
}

function matchesTown(x,town,serviceName){
  if(!town)return true;
  return townKey(addressTown(x))===town;
}

function matchesServiceTown(x,town,serviceName){
  if(!town)return true;
  // 「全縣皆可提供服務」代表 26 個鄉鎮皆符合。
  if(isCountyWide(x,serviceName)) return true;
  const specific=serviceTowns(x,serviceName);
  if(specific.length) return specific.some(v=>townKey(v)===town);
  return false;
}

  return JSON.stringify(x).toLowerCase();
}

function formatPhoneDisplay(raw){
  let s=String(raw||'').trim().replace(/\s+/g,'');
  if(!s) return '';
  // 手機：09xxxxxxxx → 09xx-xxx-xxx
  if(/^09\d{8}$/.test(s)) return s.slice(0,4)+'-'+s.slice(4,7)+'-'+s.slice(7);
  // 已有 4-3-3 手機格式則保留
  if(/^09\d{2}-\d{3}-\d{3}$/.test(s)) return s;
  // 04 市話，保留分機
  let m=s.match(/^04[-－]?(\d{7})(?:分機|#)([\d、,，/]+)$/);
  if(m) return '04-'+m[1]+'#'+m[2].replace(/[、,，/]+/g,'/');
  m=s.match(/^04[-－]?(\d{7})(?:#(\d+))?$/);
  if(m) return '04-'+m[1]+(m[2]?'#'+m[2]:'');
  // 049 等其他縣市市話
  m=s.match(/^0(49|48|47|42|43|45|46)[-－]?(\d{6,7})$/);
  if(m) return '0'+m[1]+'-'+m[2];
  return s;
}
function phoneListForService(x, serviceName){
  let ps=(x.service_phones&&x.service_phones[serviceName]);
  if(!ps||!Array.isArray(ps)||!ps.length) ps=x.phones||x.phone||[];
  if(!Array.isArray(ps)) ps=[ps];
  const out=[];
  for(const raw of ps){
    let s=String(raw||'').replace(/\r/g,'').trim();
    if(!s) continue;
    // 資料常以「；」「;」「、」放多支電話；先拆開。
    let pieces=s.split(/[\n；;、]+/).map(v=>v.trim()).filter(Boolean);
    for(const piece of pieces){
      // 少數資料把第二支 04 市話或 09 手機直接黏在第一支後面；
      // 只有在結構可明確辨識時才拆，不做猜測。
      let q=piece.match(/^(04[-－]?\d{7}(?:#\d+)?)(?=04[-－]|09\d{8}$)/);
      if(q){
        const first=q[1], rest=piece.slice(q[1].length);
        pieces.splice(pieces.indexOf(piece),1,first,...(rest?[rest]:[]));
        break;
      }
    }
    for(const piece of pieces){
      const f=formatPhoneDisplay(piece);
      if(f) out.push(f);
    }
  }
  return [...new Set(out)];
}

const ALLEY_DISTANCE_CACHE_KEY='lttc_alley_geocode_v2';
let ALLEY_ORIGIN=null;
let ALLEY_SORTING=false;
let ALLEY_RENDER_TOKEN=0;

function loadAlleyGeoCache(){
  try{return JSON.parse(localStorage.getItem(ALLEY_DISTANCE_CACHE_KEY)||'{}')||{};}
  catch(e){return {};}
}
function saveAlleyGeoCache(cache){try{localStorage.setItem(ALLEY_DISTANCE_CACHE_KEY,JSON.stringify(cache));}catch(e){}}
function normalizeAddressForGeocode(address){
  return String(address||'')
    .replace(/臺/g,'台')
    .replace(/[　\t\r\n]+/g,' ')
    .replace(/^\s*\d{3,5}\s*/,'')
    .trim();
}
function addressVariants(address,town=''){
  const raw=normalizeAddressForGeocode(address);
  const variants=[];
  const add=v=>{v=String(v||'').trim();if(v&&!variants.includes(v))variants.push(v);};
  const hasCounty=/彰化縣/.test(raw), hasTown=COUNTY_TOWNS.some(t=>raw.includes(t));
  add(raw);
  let v=raw;
  if(!hasCounty) v='彰化縣'+v;
  if(town && !hasTown) v='彰化縣'+town+v.replace(/^彰化縣/,'');
  add(v);
  // 地址資料常包含村里、樓層或「之」等資訊；定位失敗時，逐步簡化到道路＋門牌，讓巷弄長照站仍能取得可用的近似座標。
  add(v.replace(/(彰化縣(?:[^市縣鄉鎮]+[市縣鄉鎮]))[^0-9]*([一-龜A-Za-z0-9]+路)/,'$1$2'));
  add(v.replace(/(\d+)樓.*$/,'$1樓'));
  add(v.replace(/\s*之\s*/g,'之'));
  add(v.replace(/(?:第?\d+鄰)?[一-龜A-Za-z]+(?:村|里)/g,''));
  add(v.replace(/(巷|弄)\s*\d+/g,'$1'));
  add(v.replace(/(彰化縣.*?[路街])\d+巷?\d*號.*$/,'$1'));
  return variants;
}
function haversineKm(a,b){
  const R=6371, rad=Math.PI/180;
  const dLat=(b.lat-a.lat)*rad, dLng=(b.lng-a.lng)*rad;
  const la1=a.lat*rad, la2=b.lat*rad;
  const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function formatDistance(km){
  if(!Number.isFinite(km)) return '';
  if(km<1) return `${Math.round(km*1000)} 公尺`;
  return `${km.toFixed(km<10?1:0)} 公里`;
}

async function fetchJSONWithTimeout(url,options={},ms=7000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),ms);
  try{
    const res=await fetch(url,{...options,signal:controller.signal});
    if(!res.ok) throw new Error('request failed');
    return await res.json();
  }finally{clearTimeout(timer);}
}

async function geocodeWithArcGIS(address,town=''){
  const variants=addressVariants(address,town);
  const explicitTown=COUNTY_TOWNS.find(t=>String(address||'').includes(t))||town||'';
  let best=null;
  for(const line of variants){
    const params=new URLSearchParams({
      SingleLine:line,
      countryCode:'TWN',
      sourceCountry:'TWN',
      category:'Address',
      maxLocations:'5',
      outFields:'Match_addr,Addr_type,Score,City,Subregion,Region',
      matchOutOfRange:'true',
      interpolatePointAddress:'true',
      langCode:'zh-TW',
      outSR:'4326',
      f:'json'
    });
    // 如果使用者已選鄉鎮，另外把鄉鎮／縣市帶給 ArcGIS，避免只靠中文單行地址猜位置。
    if(explicitTown) params.set('city',explicitTown);
    params.set('subregion','彰化縣');
    const url='https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?'+params.toString();
    try{
      const data=await fetchJSONWithTimeout(url,{headers:{'Accept':'application/json'}},6500);
      const candidates=Array.isArray(data?.candidates)?data.candidates:[];
      for(const c of candidates){
        const score=Number(c?.score);
        const lat=Number(c?.location?.y), lng=Number(c?.location?.x);
        if(!Number.isFinite(lat)||!Number.isFinite(lng)) continue;
        const a=String(c.address||c.attributes?.Match_addr||'');
        const city=String(c.attributes?.City||c.attributes?.Subregion||'');
        const townHit=!explicitTown || a.includes(explicitTown) || city.includes(explicitTown);
        const quality=(Number.isFinite(score)?score:0)+(townHit?12:0)+(String(c.attributes?.Addr_type||'').toLowerCase().includes('point')?5:0);
        if(!best || quality>best.quality) best={lat,lng,provider:'ArcGIS',score:Number.isFinite(score)?score:null,matchAddress:a,quality};
        // 分數已很高且鄉鎮也吻合，不必再嘗試更弱的變體。
        if(Number.isFinite(score)&&score>=85&&townHit) return best;
      }
    }catch(e){}
  }
  if(best && (best.quality>=45 || best.matchAddress)){
    delete best.quality;
    return best;
  }
  throw new Error('ArcGIS geocode failed');
}

async function geocodeWithNominatim(address,town=''){
  const variants=addressVariants(address,town);
  // 只拿前幾個最有機會成功的變體，避免一次地址失敗就產生大量公開服務請求。
  for(const line of variants.slice(0,5)){
    const q=encodeURIComponent(line.includes('台灣')?line:`台灣 ${line}`);
    const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=tw&accept-language=zh-TW&addressdetails=1&q=${q}`;
    try{
      const data=await fetchJSONWithTimeout(url,{headers:{'Accept':'application/json'}},8000);
      if(Array.isArray(data)&&data.length){
        const lat=Number(data[0].lat),lng=Number(data[0].lon);
        if(Number.isFinite(lat)&&Number.isFinite(lng)) return {lat,lng,provider:'Nominatim',matchAddress:data[0].display_name||''};
      }
    }catch(e){}
    await new Promise(r=>setTimeout(r,1100));
  }
  throw new Error('Nominatim geocode failed');
}

async function geocodeAddress(address,town=''){
  const key=normalizeAddressForGeocode(address)+'|'+String(town||'');
  if(!key.split('|')[0]) throw new Error('empty address');
  const cache=loadAlleyGeoCache();
  if(cache[key] && Number.isFinite(cache[key].lat) && Number.isFinite(cache[key].lng)) return cache[key];
  let point;
  try{point=await geocodeWithArcGIS(address,town);}
  catch(e){point=await geocodeWithNominatim(address,town);}
  cache[key]=point;
  saveAlleyGeoCache(cache);
  return point;
}

async function attachAlleyDistances(rows,token){
  if(!ALLEY_ORIGIN) return rows;
  const cache=loadAlleyGeoCache();
  const out=new Array(rows.length);
  let next=0, done=0, success=0, total=rows.length;
  const town=$('town')?.value||'';
  const townName=COUNTY_TOWNS.find(t=>townKey(t)===town)||'';
  const worker=async()=>{
    while(true){
      if(token!==ALLEY_RENDER_TOKEN) return;
      const i=next++;
      if(i>=total) return;
      const x=rows[i].x, key=normalizeAddressForGeocode(x.address)+'|'+townName;
      let point=cache[key];
      if(!point){
        try{point=await geocodeAddress(x.address,townName);}catch(e){point=null;}
      }
      const distance=point?haversineKm(ALLEY_ORIGIN,point):Infinity;
      if(Number.isFinite(distance)) success++;
      out[i]={...rows[i],distance};
      done++;
      if(token!==ALLEY_RENDER_TOKEN) return;
      setAlleyDistanceStatus(`正在計算距離… ${done}/${total}`);
    }
  };
  // ArcGIS 可快速處理；若少數地址需要 Nominatim fallback，仍不會同時大量轟擊公開服務。
  await Promise.all(Array.from({length:Math.min(4,total)},()=>worker()));
  if(token!==ALLEY_RENDER_TOKEN) return rows;
  out.sort((a,b)=>a.distance-b.distance);
  return out;
}

function resourceMatches(x,q,town,serviceTown,resourceId){
  const hay=JSON.stringify(x).toLowerCase();
  const t=addressTown(x);
  const addressOK=!town||townKey(t)===town;
  let serviceOK=true;
  if(serviceTown && resourceId==='family_care'){
    const raw=String(x.service_area||'');
    serviceOK=raw.includes(COUNTY_TOWNS.find(v=>townKey(v)===serviceTown)||'');
  }
  return (!q||hay.includes(q))&&addressOK&&serviceOK;
}

async function renderResources(){
  const r=DB.otherResources[CURRENT_RESOURCE];
  if(!r) return;
  const token=++ALLEY_RENDER_TOKEN;
  const q=$('q').value.trim().toLowerCase(), town=$('town').value, serviceTown=$('serviceTown').value;
  let rows=r.records.filter(x=>resourceMatches(x,q,town,serviceTown,CURRENT_RESOURCE)).map(x=>({x,service:r.name,resourceId:CURRENT_RESOURCE}));
  if(CURRENT_RESOURCE==='alley' && ALLEY_ORIGIN){
    ALLEY_SORTING=true;
    $('count').textContent=`找到 ${rows.length} 筆（準備計算距離…）`;
    $('list').innerHTML=rows.length?rows.map(row=>resourceCardHTML(row.x,CURRENT_RESOURCE)).join(''):'<div class="empty">找不到符合條件的其他資源</div>';
    const sorted=await attachAlleyDistances(rows,token);
    if(token!==ALLEY_RENDER_TOKEN) return;
    rows=sorted;
    rows.forEach(row=>{if(Number.isFinite(row.distance)) row.x._distance=row.distance; else delete row.x._distance;});
    ALLEY_SORTING=false;
    const ok=rows.filter(r=>Number.isFinite(r.distance)).length;
    setAlleyDistanceStatus(`已依直線距離由近到遠排序，共 ${ok}/${rows.length} 筆成功定位。`);
  }
  if(token!==ALLEY_RENDER_TOKEN) return;
  CURRENT_ROWS=rows;
  $('count').textContent=`找到 ${rows.length} 筆`;
  $('list').innerHTML=rows.length?rows.map(row=>resourceCardHTML(row.x,CURRENT_RESOURCE)).join(''):'<div class="empty">找不到符合條件的其他資源</div>';
  const copyAll=$('copyAllBtn'); if(copyAll) copyAll.disabled=!rows.length;
  $('source').innerHTML=`資料來源：${esc(r.source)}`;
}

async function copyCard(btn){
  const text=btn.dataset.copy||"";
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    document.execCommand("copy");ta.remove();
  }
  const old=btn.textContent;
  btn.textContent="已複製 ✓";
  setTimeout(()=>btn.textContent=old,1200);
}

async function copyAllResults(){
  if(!CURRENT_ROWS.length) return;

  const text=CURRENT_ROWS.map(row=>row.resourceId?resourceCopyText(row.x,row.resourceId):cardCopyText(row.x,row.service)).join("\n\n");
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    document.execCommand("copy");ta.remove();
  }

  const btn=$('copyAllBtn');
  if(btn){
    const old=btn.textContent;
    btn.textContent="已複製 ✓";
    setTimeout(()=>btn.textContent=old,1400);
  }
}

function cardCopyText(x, serviceName){
  const lines=[x.name||""];
  const phones=phoneListForService(x,serviceName);
  if(phones.length) lines.push(...phones);
  const d=(x.details||{})[serviceName]||{};
  const window=d["窗口"]||"";
  if(window && phones.length) lines[lines.length-1]+= ` ${window}`;
  // 居家、交通、專業等不複製地址；日照、家庭托顧、機構喘息需複製地址。
  if(["日間照顧","家庭托顧","喘息服務"].includes(serviceName) && x.address) lines.push(x.address);
  return lines.filter(Boolean).join("\n");
}

function cardHTML(x, serviceName){
  const service=serviceName||CURRENT.name;
  const d=(x.details||{})[service]||{};
  const phones=phoneListForService(x,service);
  const window=d["窗口"]||"";
  const copy=esc(cardCopyText(x,service));
  const info=serviceDetailsHTML(x,service);
  return `<article class="card">
    <div class="card-top">
      <div class="card-service-row">
        <span class="card-service">${esc(service)}</span>
        <button class="copy-btn" type="button" data-copy="${copy}" onclick="copyCard(this)">複製</button>
      </div>
      <div class="name">${esc(x.name)}</div>
      <div class="card-contact">
        ${phones.length?`<div class="phone">${phones.map(p=>`<span class="phone-line">${cleanPhone(p)}</span>`).join('')}${window?`<span class="window-name">${esc(window)}</span>`:''}</div>`:''}
        ${x.address?`<div class="address">${esc(x.address)}</div>`:''}
      </div>
    </div>
    ${info?`<div class="card-divider"></div>
    <div class="card-bottom">
      <div class="info-title">相關資訊</div>
      ${info}
    </div>`:''}
  </article>`;
}

function explodeForService(){
  if(CURRENT.id!=="all") return CURRENT.records.map(x=>({x,service:CURRENT.name}));
  const result=[];
  // 全部服務：每一個「單位＋服務」都是獨立卡片，不合併、不去掉不同服務
  for(const s of DB.services){
    if(s.id==="all") continue;
    for(const x of s.records){
      result.push({x,service:s.name});
    }
  }
  return result;
}

function render(){
  if(CURRENT_RESOURCE){ renderResources(); return; }
  const q=$('q').value.trim().toLowerCase(), town=$('town').value, serviceTown=$('serviceTown').value;
  const base=explodeForService();
  const rows=base.filter(({x,service})=>{
    const hay=(JSON.stringify(x)+" "+service).toLowerCase();
    return (!q||hay.includes(q))&&matchesTown(x,town,service)&&matchesServiceTown(x,serviceTown,service);
  });
  CURRENT_ROWS=rows;
  $('count').textContent=`找到 ${rows.length} 筆`;
  $('list').innerHTML=rows.length?rows.map(({x,service})=>cardHTML(x,service)).join(''):'<div class="empty">找不到符合條件的特約單位</div>';
  const copyAll=$('copyAllBtn');
  if(copyAll) copyAll.disabled=!rows.length;
  $('source').innerHTML=`資料已整合：居家服務、交通接送、日間照顧（含小規模多機能）、家庭托顧、營養餐飲、專業服務、到宅沐浴、定點乾燥、A級單位、喘息服務`;
}

function switchService(id){
  CURRENT_RESOURCE='';
  CURRENT=DB.services.find(s=>s.id===id)||DB.services[0];
  $('town').value='';
  $('serviceTown').value='';
  const serviceTownRow=$('serviceTownRow'); if(serviceTownRow) serviceTownRow.style.display='block';
  $('otherResources')?.classList.remove('open');
  $('otherToggle')?.setAttribute('aria-expanded','false');
  renderResourceButtons();
  renderButtons();
  populateTowns();
  // 保留搜尋列文字：切換服務時仍用同一個關鍵字重新搜尋
  render();
}

function switchResource(id){
  if(!DB.otherResources[id]) return;
  CURRENT_RESOURCE=id;
  ALLEY_ORIGIN=null;
  const clearDistance=$('alleyClearDistanceBtn'); if(clearDistance) clearDistance.hidden=true;
  $('town').value='';
  $('serviceTown').value='';
  const box=$('otherResources');
  if(box) box.classList.add('open');
  $('otherToggle')?.setAttribute('aria-expanded','true');
  renderResourceButtons();
  populateResourceTowns(id);
  renderResources();
}

function init(){
  CURRENT=DB.services[0];
  CURRENT_RESOURCE='';
  renderButtons();
  renderResourceButtons();
  populateTowns();
  const serviceTownRow=$('serviceTownRow'); if(serviceTownRow) serviceTownRow.style.display='block';
  render();
  $('q').addEventListener('input',render);
  $('town').addEventListener('change',render);
  $('serviceTown').addEventListener('change',render);
  const otherToggle=$('otherToggle');
  if(otherToggle){
    otherToggle.addEventListener('click',()=>{
      const box=$('otherResources');
      const open=box.classList.toggle('open');
      otherToggle.setAttribute('aria-expanded',String(open));
    });
  }
  const alleyAddressBtn=$('alleyAddressBtn');
  if(alleyAddressBtn) alleyAddressBtn.addEventListener('click',applyAlleyDistanceFromAddress);
  const alleyLocationBtn=$('alleyLocationBtn');
  if(alleyLocationBtn) alleyLocationBtn.addEventListener('click',applyAlleyDistanceFromCurrent);
  const alleyClearDistanceBtn=$('alleyClearDistanceBtn');
  if(alleyClearDistanceBtn) alleyClearDistanceBtn.addEventListener('click',clearAlleyDistance);
  const alleyAddressInput=$('alleyAddressInput');
  if(alleyAddressInput) alleyAddressInput.addEventListener('keydown',e=>{if(e.key==='Enter')applyAlleyDistanceFromAddress();});
}

const backToTopBtn=$('backToTop');
function updateBackToTop(){if(!backToTopBtn)return;backToTopBtn.classList.toggle('show',window.scrollY>500)}
window.addEventListener('scroll',updateBackToTop,{passive:true});
if(backToTopBtn){backToTopBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));updateBackToTop()}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();
</script>
</body>
