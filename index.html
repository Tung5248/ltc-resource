let CURRENT=null;
let CURRENT_ROWS=[];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clean=s=>String(s??'').replace(/\s+/g,' ').trim();
const normTown=s=>String(s??'').replace(/[、，,；;]/g,' ').split(/\s+/).map(x=>x.trim()).filter(Boolean);
const townKey=s=>String(s??'').trim().replace(/(市|鎮|鄉)$/,'');
const cleanPhone=s=>esc(s).replace(/[；;\/]/g,'<br>');

function allTowns(records){
  const map=new Map();
  records.forEach(x=>{
    const vals=[x.town];
    const d=x.details||{};
    for(const v of Object.values(d)){
      if(Array.isArray(v)) vals.push(...v);
      else if(typeof v==='string' && (v.includes('鄉')||v.includes('鎮')||v.includes('市'))) vals.push(...normTown(v));
    }
    vals.flatMap(v=>normTown(v)).forEach(t=>{
      const k=townKey(t); if(!k)return;
      const old=map.get(k);
      if(!old || (/[市鎮鄉]$/.test(t)&&!/[市鎮鄉]$/.test(old))) map.set(k,t);
    });
  });
  return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant'));
}

function renderButtons(){
  $('serviceButtons').innerHTML=DB.services.map(s=>
    `<button type="button" class="service-btn ${s.id===CURRENT.id?'active':''}" data-service="${esc(s.id)}">${esc(s.name)}</button>`
  ).join('');
  $('serviceButtons').querySelectorAll('.service-btn').forEach(btn=>
    btn.addEventListener('click',()=>switchService(btn.dataset.service))
  );
}

function populateTowns(){
  const towns=allTowns(CURRENT.records);
  $('town').innerHTML='<option value="">全部鄉鎮</option>'+
    towns.map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join('');
}

function matchesTown(x,town){
  if(!town)return true;
  const vals=[x.town];
  for(const v of Object.values(x.details||{})){
    if(Array.isArray(v)) vals.push(...v);
    else if(typeof v==='string') vals.push(...normTown(v));
  }
  return vals.flatMap(v=>normTown(v)).some(v=>townKey(v)===town);
}

function searchText(x){
  return JSON.stringify(x).toLowerCase();
}

function phoneListForService(x, serviceName){
  let ps=(x.service_phones&&x.service_phones[serviceName]);
  if(!ps||!Array.isArray(ps)||!ps.length) ps=x.phones||x.phone||[];
  if(!Array.isArray(ps)) ps=String(ps||"").split(/[\n；;]+/);
  const out=[];
  for(const raw of ps){
    let s=String(raw||"").replace(/\r/g,"").trim();
    if(!s) continue;
    // 防止資料來源把兩支 04 電話黏成一段
    const pieces=s.split(/(?=04[-－])/).map(v=>v.trim()).filter(Boolean);
    out.push(...pieces);
  }
  return [...new Set(out)];
}
function phoneForService(x, serviceName){
  return phoneListForService(x,serviceName)[0]||'';
}

function phoneHTML(x, serviceName){
  const phones=phoneListForService(x,serviceName);
  if(!phones.length) return '';
  const d=(x.details||{})[serviceName]||{};
  const window=d["窗口"]||'';
  return `<div class="phone">${phones.map((p,i)=>`${i?'<br>':''}${cleanPhone(p)}`).join('')}${window?`<span class="window-name">${esc(window)}</span>`:''}</div>`;
}

function trafficHTML(x){
  const td=x.traffic_info||(x.details||{})["交通接送"]||{};
  const area=td["服務鄉鎮"]||td["服務區域"]||"";
  const note=td["備註"]||"";
  const bd=td["BD03"]===true||/BD03/.test(note);
  const seat=td["兒童安全汽座"]===true||/兒童安全汽座/.test(note);
  const sat=td["周六"]||(/周六無服務/.test(note)?"無服務":(/周六預約制/.test(note)?"預約制":""));
  return `<div class="service-detail">
    ${area?`<div class="service-detail-line"><b>服務鄉鎮：</b>${esc(area)}</div>`:''}
    ${seat?`<div class="service-mini"><b>兒童安全汽座：</b>有</div>`:''}
    ${sat?`<div class="service-mini"><b>周六：</b>${esc(sat)}</div>`:''}
    ${bd?`<div class="service-mini"><b>BD03</b></div>`:''}
  </div>`;
}

function bathDrySingleHTML(x, svc){
  const d=(x.details||{})[svc]||{};
  const area=d["服務區域"]||d["服務鄉鎮"]||"";
  const lines=[];
  for(const [k,v] of Object.entries(d)){
    if(["服務區域","服務鄉鎮","窗口"].includes(k)||v==null||v==="") continue;
    lines.push(`<div class="service-group-info"><b>${esc(k)}：</b>${esc(Array.isArray(v)?v.join('、'):v)}</div>`);
  }
  return `<div class="service-detail">
    <div class="service-group">
      ${area?`<div class="service-group-info"><b>服務區域：</b>${esc(area)}</div>`:''}
      ${lines.join('')}
    </div>
  </div>`;
}

function professionalHTML(x){
  const pd=(x.details||{})["專業服務"]||{};
  const codes=pd["服務代碼"]||x.service_codes||[];
  const towns=pd["服務鄉鎮"]||[];
  return `<div class="service-detail professional-detail">
    ${codes.length?`<div class="code-list">${codes.map(c=>`<span class="code">${esc(c)}</span>`).join('')}</div>`:''}
    ${towns.length?`<div class="service-detail-line"><b>服務鄉鎮：</b>${esc(towns.join('、'))}</div>`:''}
  </div>`;
}

function genericServiceHTML(x, serviceName){
  const d=(x.details||{})[serviceName];
  if(!d||typeof d!=="object") return '';
  const lines=[];
  for(const [k,v] of Object.entries(d)){
    if(k==="窗口"||v==null||v==="") continue;
    lines.push(`<div class="service-detail-line"><b>${esc(k)}：</b>${esc(Array.isArray(v)?v.join('、'):v)}</div>`);
  }
  return lines.length?`<div class="service-detail">${lines.join('')}</div>`:'';
}

function respiteHTML(x){
  const d=(x.details||{})["喘息服務"]||{};
  const types=d["喘息類型"]||x.service_types||[];
  if(!types.length) return "";
  return `<div class="service-detail">
    <div class="respite-list">${types.map(v=>`<span class="respite-type">● ${esc(v)}</span>`).join('')}</div>
  </div>`;
}

function serviceDetailsHTML(x, serviceName){
  if(serviceName==="喘息服務") return respiteHTML(x);
  if(serviceName==="交通接送") return trafficHTML(x);
  if(serviceName==="專業服務") return professionalHTML(x);
  if(serviceName==="到宅沐浴"||serviceName==="定點乾燥") return bathDrySingleHTML(x,serviceName);
  return genericServiceHTML(x,serviceName);
}

function cardCopyText(x, serviceName){
  const d=(x.details||{})[serviceName]||{};
  const ps=(x.service_phones&&x.service_phones[serviceName])||x.phones||[];
  const phoneList=Array.isArray(ps)?ps.filter(Boolean):String(ps||"").split(/\s*;\s*/).filter(Boolean);
  const window=d["窗口"]||"";

  // 直接貼給家屬，不加入「單位／電話／地址」等欄位標題
  const lines=[x.name||""];
  if(phoneList.length){
    lines.push(...phoneList);
    if(window) lines[lines.length-1] += `（${window}）`;
  }
  // 機構喘息也需要地址；與日照、家庭托顧相同列入複製內容
  const isInstitutionRespite =
    serviceName==="機構喘息" ||
    (serviceName==="喘息服務" && ((d["喘息類型"]||[]).includes("機構喘息")));
  if(["日間照顧","家庭托顧"].includes(serviceName) || isInstitutionRespite){
    lines.push(x.address);
  }
  return lines.filter(Boolean).join("\n");
}

async function copyCard(btn){
  const text=btn.dataset.copy||"";
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    document.execCommand("copy");ta.remove();
  }
  const old=btn.textContent;
  btn.textContent="已複製 ✓";
  setTimeout(()=>btn.textContent=old,1200);
}

async function copyAllResults(){
  if(!CURRENT_ROWS.length) return;

  const text=CURRENT_ROWS.map(({x,service})=>cardCopyText(x,service)).join("\n\n");
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    document.execCommand("copy");ta.remove();
  }

  const btn=$('copyAllBtn');
  if(btn){
    const old=btn.textContent;
    btn.textContent="已複製 ✓";
    setTimeout(()=>btn.textContent=old,1400);
  }
}

function cardHTML(x, serviceName){
  const service=serviceName||CURRENT.name;
  const d=(x.details||{})[service]||{};
  const phones=phoneListForService(x,service);
  const window=d["窗口"]||"";
  const copy=esc(cardCopyText(x,service));
  const info=serviceDetailsHTML(x,service);
  return `<article class="card">
    <div class="card-top">
      <div class="card-service-row">
        <span class="card-service">${esc(service)}</span>
        <button class="copy-btn" type="button" data-copy="${copy}" onclick="copyCard(this)">複製</button>
      </div>
      <div class="name">${esc(x.name)}</div>
      <div class="card-contact">
        ${phones.length?`<div class="phone">${phones.map((p,i)=>`${i?'<br>':''}${cleanPhone(p)}`).join('')}${window?`<span class="window-name">${esc(window)}</span>`:''}</div>`:''}
        ${x.address?`<div class="address">${esc(x.address)}</div>`:''}
      </div>
    </div>
    ${info?`<div class="card-divider"></div>
    <div class="card-bottom">
      <div class="info-title">服務相關資訊</div>
      ${info}
    </div>`:''}
  </article>`;
}

function explodeForService(){
  if(CURRENT.id!=="all") return CURRENT.records.map(x=>({x,service:CURRENT.name}));
  const result=[];
  // 全部服務：每一個「單位＋服務」都是獨立卡片，不合併、不去掉不同服務
  for(const s of DB.services){
    if(s.id==="all") continue;
    for(const x of s.records){
      result.push({x,service:s.name});
    }
  }
  return result;
}

function render(){
  const q=$('q').value.trim().toLowerCase(), town=$('town').value;
  const base=explodeForService();
  const rows=base.filter(({x,service})=>{
    const hay=(JSON.stringify(x)+" "+service).toLowerCase();
    return (!q||hay.includes(q))&&matchesTown(x,town);
  });
  CURRENT_ROWS=rows;
  $('count').textContent=`找到 ${rows.length} 筆`;
  $('list').innerHTML=rows.length?rows.map(({x,service})=>cardHTML(x,service)).join(''):'<div class="empty">找不到符合條件的特約單位</div>';
  const copyAll=$('copyAllBtn');
  if(copyAll) copyAll.disabled=!rows.length;
  $('source').innerHTML=`資料已整合：居家服務、交通接送、日間照顧（含小規模多機能）、家庭托顧、營養餐飲、專業服務、到宅沐浴、定點乾燥、A級單位、喘息服務`;
}

function switchService(id){
  CURRENT=DB.services.find(s=>s.id===id)||DB.services[0];
  $('town').value='';
  renderButtons();
  populateTowns();
  // 保留搜尋列文字：切換服務時仍用同一個關鍵字重新搜尋
  render();
}

function init(){
  CURRENT=DB.services[0];
  renderButtons();
  populateTowns();
  render();
  $('q').addEventListener('input',render);
  $('town').addEventListener('change',render);
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();
</script>
</body>
</html>
